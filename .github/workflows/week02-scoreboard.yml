name: Week 2 Scoreboard

on:
  push:
    branches: [week01-diagnostics]
  workflow_dispatch:

jobs:

  scoreboard-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Run Python scoreboard
        run: python TestBench/Golden/scoreboard.py

  rtl-capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile RTL and testbench
        run: |
          iverilog -g2012 \
            -s tb_week02_capture \
            -o week02_capture.vvp \
            RTL/Systolic_PE.v \
            RTL/Systolic_Array.v \
            TestBench/tb_week02_capture.sv

      - name: Run RTL simulation
        run: vvp week02_capture.vvp

      - name: Show captured outputs
        run: cat week02_rtl_outputs.csv

      - name: Save captured CSV
        uses: actions/upload-artifact@v4
        with:
          name: week02-rtl-outputs
          path: week02_rtl_outputs.csv
