
name: Week 2 Scoreboard

on:
  push:
    branches: [week01-diagnostics]
  workflow_dispatch:

jobs:
  scoreboard-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Run scoreboard
        run: python TestBench/Golden/scoreboard.py
